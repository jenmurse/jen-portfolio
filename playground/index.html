<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Jen Murse</title>
  <meta name="description" content="Experiments and side projects by Jen Murse. Things I make to learn a new medium.">
  <meta property="og:title" content="Playground — Jen Murse">
  <meta property="og:description" content="Experiments and side projects by Jen Murse. Things I make to learn a new medium.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://jenmurse.com/playground/cobo-visuals/10.jpg">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/playground.css">
  <style>
    .hero-grid { margin-bottom: 72px; }
    .hero-right .subtitle { margin-top: -14px; color: var(--sub); }

    /* the projects start where the title does: the hero's left column (240px) plus its gap (80px) */
    .projects {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px 24px;
      margin-left: 320px;
    }
    .project a { display: block; }
    .project .media {
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .project img, .project video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .project .name {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 14px;
    }
    .project .line {
      margin-top: 6px;
      font-size: calc(0.85rem * var(--list-scale));
      color: var(--sub);
    }
    .project a:hover .t, .project a:hover .n { opacity: 0.6; }
    .project a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }


    @media (max-width: 680px) {
      .projects { grid-template-columns: 1fr; gap: 40px 0; margin-left: 0; }
    }
  </style>
</head>
<body>

  <div id="cursor" aria-hidden="true"></div>

  <div class="page">

    <header class="hero-grid">
      <div class="hero-left">
        <a href="/" class="wordmark" aria-label="Jen Murse — home">Jen Murse</a>
        <span class="crumb" aria-current="page">Playground</span>
      </div>
      <div class="hero-right">
        <h1 class="hero-primary">Playground</h1>
        <p class="hero-secondary subtitle">Experiments and side projects. Things I make to learn a new medium.</p>
      </div>
    </header>

    <ol class="projects" aria-label="Projects">
      <li class="project">
        <a href="/playground/cobo-visuals/">
          <div class="media">
            <video src="/playground/cobo-visuals/10.mp4" poster="/playground/cobo-visuals/10.jpg" muted loop playsinline preload="none" aria-hidden="true"></video>
          </div>
          <div class="name"><span class="n">01</span><span class="t">Cobo Visuals</span></div>
          <p class="line">Two hours of generative visuals for Cobo's DJ set · 2026</p>
        </a>
      </li>
    </ol>

    <footer>
      <span>© 2026 Jen Murse</span>
    </footer>

  </div>

  <script src="/main.js"></script>
  <script>
    // a project's preview plays while the pointer is over it (never with reduced motion)
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('.project a').forEach(a => {
      const v = a.querySelector('video');
      if (!v || still) return;
      a.addEventListener('mouseenter', () => v.play().catch(() => {}));
      a.addEventListener('mouseleave', () => v.pause());
      a.addEventListener('focus', () => v.play().catch(() => {}));
      a.addEventListener('blur', () => v.pause());
    });
  </script>
</body>
</html>
