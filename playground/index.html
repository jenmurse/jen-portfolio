<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Jen Murse</title>
  <meta name="description" content="Experiments and side projects by Jen Murse. Things I make to learn a new medium.">
  <meta property="og:title" content="Playground — Jen Murse">
  <meta property="og:description" content="Experiments and side projects by Jen Murse. Things I make to learn a new medium.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://jenmurse.com/playground/cobo-visuals/12.jpg">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/playground.css">
  <style>
    /* the projects start where the title does: past the label column and its gap */
    .projects { margin: 0 0 0 calc(var(--col-left) + var(--col-gap)); }
    .projects a { display: block; }
    .projects a:hover .t, .projects a:hover .n { opacity: 0.6; }
    @media (max-width: 680px) { .projects { margin-left: 0; } }
  </style>
</head>
<body>

  <div id="cursor" aria-hidden="true"></div>

  <div class="page">

    <header class="hero-grid">
      <div class="hero-left">
        <a href="/" class="wordmark" aria-label="Jen Murse — home">Jen Murse</a>
        <span class="crumb" aria-current="page">Playground</span>
      </div>
      <div class="hero-right">
        <div class="hero-title">
          <h1 class="hero-primary">Playground</h1>
          <p class="hero-secondary">Experiments and side projects. Things I make to learn a new medium.</p>
        </div>
      </div>
    </header>

    <ol class="media-grid projects" aria-label="Projects">
      <li class="project">
        <a href="/playground/cobo-visuals/">
          <div class="frame">
            <video src="/playground/cobo-visuals/12.mp4" poster="/playground/cobo-visuals/12.jpg" muted loop playsinline preload="none" aria-hidden="true"></video>
          </div>
          <div class="caption"><span class="n">01</span><span class="t">Cobo Visuals</span></div>
          <p class="caption-line">Two hours of generative visuals for James Cobo's DJ set</p>
        </a>
      </li>
      <li class="project">
        <a href="/playground/good-measure/">
          <div class="frame">
            <img src="/playground/good-measure/tile.jpg" alt="" loading="lazy">
          </div>
          <div class="caption"><span class="n">02</span><span class="t">Good Measure</span></div>
          <p class="caption-line">A nutrition tracker and meal planner for people who cook</p>
        </a>
      </li>
    </ol>

    <footer>
      <span>© 2026 Jen Murse</span>
    </footer>

  </div>

  <script src="/main.js"></script>
  <script>
    // a project's preview plays while the pointer is over it (never with reduced motion)
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('.projects a').forEach(a => {
      const v = a.querySelector('video');
      if (!v || still) return;
      a.addEventListener('mouseenter', () => v.play().catch(() => {}));
      a.addEventListener('mouseleave', () => v.pause());
      a.addEventListener('focus', () => v.play().catch(() => {}));
      a.addEventListener('blur', () => v.pause());
    });
  </script>
</body>
</html>
